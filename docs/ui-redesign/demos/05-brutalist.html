<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05 Brutalist Motion — HengSch Todo UI Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   05 BRUTALIST MOTION — 野兽派 / 新粗野主义 + 实验排版
   酸性绿 #CCFF00 · 电光紫 #7B2FFF · 警示橙 #FF4D00
   纯黑 #000 · 纸白 #F5F5F0
   ============================================================ */
:root{
  --acid:#CCFF00;
  --purple:#7B2FFF;
  --orange:#FF4D00;
  --ink:#000;
  --paper:#F5F5F0;
  --stage:#1C1C1C;
  --work:#FF4D00;   /* work 专属撞色 · 警示橙 */
  --life:#CCFF00;   /* life 专属撞色 · 酸性绿 */
  --study:#7B2FFF;  /* study 专属撞色 · 电光紫 */
  --ff-display:"Archivo Black", Impact, "Arial Black", sans-serif;
  --ff-body:"Space Grotesk", Arial, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;border-radius:0 !important;}
html,body{height:100%;}
body{
  background:var(--stage);
  font-family:var(--ff-body);
  color:var(--paper);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* 整页撞色闪一帧（signature：黑/绿交替 2 次 60ms，只闪一次） */
body.clash{animation:clash 240ms step-end 1;}
@keyframes clash{
  0%  {background-color:#000;}
  25% {background-color:var(--acid);}
  50% {background-color:#000;}
  75% {background-color:var(--acid);}
  100%{background-color:#1C1C1C;}
}
::selection{background:var(--acid);color:#000;}

/* ---------- 无障碍焦点：3px 荧光绿 ---------- */
:where(button,a,input,select,textarea,[tabindex]):focus{outline:none;}
:where(button,a,input,select,textarea,[tabindex]):focus-visible{
  outline:3px solid var(--acid);
  outline-offset:3px;
  box-shadow:0 0 0 3px var(--ink);
  z-index:60;
  position:relative;
}

/* ============================================================
   桌面窗口 800×600 · 圆角 0 · 3px 黑描边 · 硬投影
   ============================================================ */
.viewport{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  overflow:auto;
}
.window{
  position:relative;
  width:800px;
  min-width:800px;
  height:600px;
  background:var(--paper);
  border:3px solid var(--ink);
  box-shadow:14px 14px 0 var(--ink);
  display:flex;
  flex-direction:column;
  color:var(--ink);
  transform:translate(0,0);
}
@media (max-width:900px), (max-height:700px){
  .viewport{align-items:flex-start;justify-content:flex-start;}
  .window{margin:auto;}
}

/* ---------- 标题栏 ---------- */
.titlebar{
  flex:0 0 auto;
  height:44px;
  background:var(--ink);
  color:var(--paper);
  border-bottom:3px solid var(--ink);
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 8px 0 14px;
  user-select:none;
}
.tb-dots{
  display:flex;gap:5px;flex:0 0 auto;
}
.tb-dots i{width:9px;height:9px;background:var(--acid);display:block;}
.tb-dots i:nth-child(2){background:var(--purple);}
.tb-dots i:nth-child(3){background:var(--orange);}
.tb-title{
  font-family:var(--ff-display);
  font-size:13px;
  letter-spacing:.18em;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  flex:1;
}
.tb-title b{color:var(--acid);font-weight:inherit;}
.tb-btns{display:flex;gap:6px;flex:0 0 auto;}
.tb-btn{
  width:24px;height:24px;
  background:var(--paper);
  border:3px solid var(--paper);
  color:#000;
  font-family:var(--ff-display);
  font-size:13px;
  line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:background 90ms linear,color 90ms linear;
}
.tb-btn:hover{background:var(--acid);}
.tb-btn[data-act="close"]:hover{background:var(--orange);color:#000;}
.tb-btn[data-act="max"]:hover{background:var(--purple);color:#fff;}

/* ============================================================
   顶部 · 超大标题 + 完成率巨型水印
   ============================================================ */
.stage{
  position:relative;
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--paper);
}
.masthead{
  position:relative;
  flex:0 0 auto;
  padding:14px 22px 6px;
  background:var(--paper);
  border-bottom:3px solid var(--ink);
  overflow:hidden;
  z-index:2;
}
.watermark{
  position:absolute;
  top:-24px;
  right:-8px;
  font-family:var(--ff-display);
  font-size:170px;
  line-height:1;
  color:#fff;
  opacity:.22;
  mix-blend-mode:difference;
  pointer-events:none;
  user-select:none;
  letter-spacing:-.04em;
  z-index:0;
  font-variant-numeric:tabular-nums;
}
.mast-kicker{
  position:relative;z-index:1;
  font-size:11px;
  font-weight:700;
  letter-spacing:.34em;
  text-transform:uppercase;
  display:flex;
  gap:14px;
  align-items:center;
}
.mast-kicker .k-state{text-decoration:none;background:var(--ink);color:var(--acid);padding:2px 7px;}
.mast-title{
  position:relative;z-index:1;
  font-family:var(--ff-display);
  font-size:clamp(34px,4.6vw,56px);
  line-height:.92;
  letter-spacing:-.02em;
  text-transform:uppercase;
  margin-top:4px;
  white-space:nowrap;
}
.mast-title em{
  font-style:normal;
  -webkit-text-stroke:3px var(--ink);
  color:var(--paper);
}
.mast-title u{text-decoration:none;color:var(--purple);}
.mast-meta{
  position:relative;z-index:1;
  display:flex;
  gap:8px;
  margin-top:8px;
  flex-wrap:wrap;
}
.chip-stat{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  border:3px solid var(--ink);
  padding:3px 8px;
  background:var(--paper);
}
.chip-stat.hot{background:var(--acid);}
.chip-stat.alt{background:var(--ink);color:var(--paper);}

/* ============================================================
   MARQUEE 分组横滚带（点选切换 · active 停止滚动并反色）
   ============================================================ */
.marquee{
  flex:0 0 auto;
  background:var(--ink);
  border-bottom:3px solid var(--ink);
  overflow:hidden;
  position:relative;
  z-index:3;
  cursor:ew-resize;
}
.marquee-track{
  display:flex;
  width:max-content;
  animation:marq 16s linear infinite;
  will-change:transform;
}
@keyframes marq{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.marquee:hover .marquee-track,
.marquee:focus-within .marquee-track,
.marquee.pinned .marquee-track{animation-play-state:paused;}
.m-seq{display:flex;flex:0 0 auto;}
.m-item{
  font-family:var(--ff-display);
  font-size:19px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--paper);
  background:transparent;
  border:0;
  padding:11px 26px;
  cursor:pointer;
  white-space:nowrap;
  transition:background 60ms linear,color 60ms linear;
}
.m-item:hover{background:var(--purple);color:#fff;}
.m-item.active{background:var(--acid);color:#000;}
.m-sep{
  display:flex;align-items:center;
  color:var(--orange);
  font-family:var(--ff-display);
  font-size:19px;
  padding:0 4px;
  user-select:none;
}

/* ============================================================
   任务列表 · 错位网格
   ============================================================ */
.list{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  list-style:none;
  background:var(--paper);
  position:relative;
  z-index:1;
}
.list::-webkit-scrollbar{width:14px;}
.list::-webkit-scrollbar-track{background:var(--paper);border-left:3px solid var(--ink);}
.list::-webkit-scrollbar-thumb{background:var(--ink);border:3px solid var(--paper);}

.row{
  position:relative;
  display:grid;
  grid-template-columns:auto auto 1fr auto;
  align-items:center;
  gap:16px;
  padding:20px 22px;
  border-bottom:3px solid var(--ink);
  background:var(--paper);
  cursor:pointer;
  transition:padding 240ms linear;
}
/* 错位：偶数行整体右移 24px（padding-left 差异） */
.row:nth-child(even){padding-left:46px;}
/* hover 整行 mix-blend difference 反色（白底变黑）——由混合自动完成，
   不做子元素颜色预反转，否则 difference 计算结果反而不可见 */
.row:hover{mix-blend-mode:difference;}

.check{
  width:38px;height:38px;
  flex:0 0 auto;
  border:3px solid var(--ink);
  background:var(--paper);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  padding:0;
  transition:background 90ms linear;
}
.check .tick{
  width:22px;height:22px;
  background:transparent;
  clip-path:polygon(14% 46%,0 62%,38% 100%,100% 22%,84% 8%,36% 68%);
  transition:background 90ms linear;
}
.check[aria-checked="true"]{background:var(--acid);}
.check[aria-checked="true"] .tick{background:var(--ink);}

.idx{
  font-family:var(--ff-display);
  font-size:clamp(26px,3vw,40px);
  line-height:1;
  letter-spacing:-.03em;
  color:var(--ink);
  min-width:64px;
  font-variant-numeric:tabular-nums;
  transition:color 90ms linear;
}
.t-main{min-width:0;transition:color 90ms linear;}
.t-title{
  font-family:var(--ff-display);
  font-size:clamp(28px,4vw,52px);
  line-height:1.02;
  letter-spacing:-.01em;
  color:var(--ink);
  word-break:break-word;
  background-image:linear-gradient(#000,#000);
  background-repeat:no-repeat;
  background-position:0 56%;
  background-size:0% 5px;
  -webkit-box-decoration-break:clone;
  box-decoration-break:clone;
  transition:background-size 120ms linear,color 120ms linear,-webkit-text-stroke-color 120ms linear;
}
.t-sub{
  display:flex;
  gap:8px;
  margin-top:7px;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.t-sub .grp{color:#66665F;}
.tag-pri{
  background:var(--orange);
  color:#000;
  padding:1px 6px;
  letter-spacing:.1em;
}
.tag-rep{background:var(--ink);color:var(--acid);padding:1px 6px;}

.row.done{padding-top:9px;padding-bottom:9px;}
.row.done .t-title{
  color:transparent;
  -webkit-text-stroke:3px var(--ink);
  background-size:100% 5px;
}
.row.done .idx{
  color:transparent;
  -webkit-text-stroke:3px var(--ink);
}
/* 不支持 text-stroke 的浏览器：保留实心字 + 划线 */
@supports not (-webkit-text-stroke: 3px #000){
  .row.done .t-title,.row.done .idx{color:var(--ink);}
}
.row.done .t-sub .grp{color:#70706A;}
.row.done .sticker{filter:grayscale(1);}

.meta{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:7px;
  flex:0 0 auto;
}
.sticker{
  font-family:var(--ff-display);
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
  background:var(--ink);
  color:var(--paper);
  border:3px solid var(--ink);
  padding:5px 11px;
  transform:rotate(-3deg);
  transition:background 90ms linear,color 90ms linear,border-color 90ms linear,filter 160ms linear,opacity 160ms linear;
}
.sticker[data-g="work"]{background:var(--work);color:#000;}
.sticker[data-g="life"]{background:var(--life);color:#000;}
.sticker[data-g="study"]{background:var(--study);color:#fff;}
.due{
  font-size:11px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  background:var(--paper);
  color:var(--ink);
  border:3px solid var(--ink);
  padding:3px 9px;
  transform:rotate(-3deg);
  transition:background 90ms linear,color 90ms linear,border-color 90ms linear;
}
.due.none{border-style:dashed;opacity:.6;}

/* 入场：行标题字符 stagger 错位上移（每行 40ms 延迟） */
.tok{
  display:inline-block;
  transform:translateY(.55em);
  opacity:0;
  animation:tokIn 300ms steps(5,end) forwards;
  animation-delay:calc(var(--row) * 40ms + var(--i) * 16ms);
}
@keyframes tokIn{to{transform:translateY(0);opacity:1;}}

.empty{
  padding:44px 24px;
  text-align:center;
  font-family:var(--ff-display);
  font-size:26px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
}
.empty small{
  display:block;
  margin-top:10px;
  font-family:var(--ff-body);
  font-size:11px;
  letter-spacing:.24em;
  opacity:.6;
}

/* ============================================================
   添加按钮 · 右下角固定方块
   ============================================================ */
.fab{
  position:absolute;
  right:20px;
  bottom:20px;
  width:66px;height:66px;
  background:var(--acid);
  border:3px solid var(--ink);
  box-shadow:7px 7px 0 var(--ink);
  font-family:var(--ff-display);
  font-size:44px;
  line-height:1;
  color:#000;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:20;
  transition:transform 80ms linear,box-shadow 80ms linear,background 80ms linear;
}
.fab:hover{background:var(--orange);}
.fab:active{transform:translate(7px,7px);box-shadow:0 0 0 var(--ink);}
/* 焦点环不吞硬投影（须晚于组件规则声明） */
.fab:focus-visible{
  outline:3px solid var(--acid);
  outline-offset:3px;
  box-shadow:7px 7px 0 var(--ink),0 0 0 3px var(--ink);
}

/* ============================================================
   添加浮层 · 全屏紫遮罩 + 白粗边框表单
   ============================================================ */
.overlay{
  position:fixed;
  inset:0;
  background:var(--purple);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  opacity:0;
  visibility:hidden;
  transition:opacity 120ms linear,visibility 0ms linear 120ms;
}
.overlay.open{opacity:1;visibility:visible;transition:opacity 120ms linear;}
.overlay::before{
  content:"NEW ENTRY NEW ENTRY NEW ENTRY";
  position:absolute;
  top:12px;left:-4%;
  width:108%;
  font-family:var(--ff-display);
  font-size:clamp(40px,7vw,96px);
  color:#000;
  opacity:.14;
  white-space:nowrap;
  pointer-events:none;
  letter-spacing:.02em;
}
.card{
  position:relative;
  width:min(560px,100%);
  background:#000;
  border:5px solid var(--paper);
  box-shadow:14px 14px 0 #000;
  padding:30px 30px 26px;
  transform:translateY(14px);
  transition:transform 140ms steps(4,end);
  max-height:calc(100vh - 48px);
  overflow-y:auto;
}
.overlay.open .card{transform:translateY(0);}
.card h2{
  font-family:var(--ff-display);
  font-size:clamp(42px,6vw,74px);
  line-height:.9;
  color:var(--acid);
  letter-spacing:-.02em;
  text-transform:uppercase;
}
.card h2 span{
  color:transparent;
  -webkit-text-stroke:3px var(--paper);
}
.card-sub{
  margin-top:8px;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:var(--paper);
  opacity:.7;
}
.field{margin-top:20px;}
.field > label{
  display:block;
  font-family:var(--ff-display);
  font-size:12px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--acid);
  margin-bottom:8px;
}
.field input[type="text"],
.field select{
  width:100%;
  background:#000;
  border:3px solid var(--paper);
  color:var(--paper);
  font-family:var(--ff-body);
  font-size:17px;
  font-weight:500;
  padding:13px 14px;
}
.field input[type="text"]::placeholder{color:#7a7a7a;}
.field select{cursor:pointer;appearance:none;background-image:none;}
.opts{display:flex;gap:10px;flex-wrap:wrap;}
.opt{position:relative;}
.opt input{
  position:absolute;opacity:0;width:100%;height:100%;left:0;top:0;cursor:pointer;margin:0;
}
.opt span{
  display:block;
  font-family:var(--ff-display);
  font-size:14px;
  letter-spacing:.1em;
  text-transform:uppercase;
  border:3px solid var(--paper);
  color:var(--paper);
  padding:10px 16px;
  cursor:pointer;
  transition:background 60ms linear,color 60ms linear,border-color 60ms linear;
}
.opt input:checked + span{background:var(--acid);color:#000;border-color:var(--acid);}
.opt input:focus-visible + span{outline:3px solid var(--acid);outline-offset:2px;}
.opt[data-g="work"] input:checked + span{background:var(--work);border-color:var(--work);}
.opt[data-g="life"] input:checked + span{background:var(--life);border-color:var(--life);}
.opt[data-g="study"] input:checked + span{background:var(--study);border-color:var(--study);color:#fff;}
.card-actions{
  display:flex;
  gap:14px;
  margin-top:26px;
  align-items:stretch;
}
.btn{
  font-family:var(--ff-display);
  font-size:17px;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:15px 22px;
  border:3px solid var(--paper);
  background:#000;
  color:var(--paper);
  cursor:pointer;
  transition:background 60ms linear,color 60ms linear;
}
.btn:hover{background:var(--paper);color:#000;}
.btn-primary{
  flex:1;
  background:var(--acid);
  border-color:var(--acid);
  color:#000;
  box-shadow:7px 7px 0 var(--paper);
}
.btn-primary:hover{background:var(--orange);border-color:var(--orange);color:#000;}
.btn-primary:active{transform:translate(4px,4px);box-shadow:3px 3px 0 var(--paper);}
.btn-primary:focus-visible{
  outline:3px solid var(--acid);
  outline-offset:3px;
  box-shadow:7px 7px 0 var(--paper),0 0 0 3px var(--ink);
}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ============================================================
   prefers-reduced-motion：关闭闪烁 / 错位入场 / 横滚
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  body.clash{animation:none;}
  .marquee-track{animation:none !important;}
  .tok{animation:none !important;transform:none !important;opacity:1 !important;}
  .row,.t-title,.sticker,.due,.card,.overlay,.fab,.tb-btn{transition-duration:60ms !important;}
  .overlay .card{transform:none !important;}
}
</style>
</head>
<body>

<div class="viewport">
  <div class="window" role="application" aria-label="HengSch Todo 桌面窗口演示">

    <!-- ========== 标题栏 ========== -->
    <header class="titlebar">
      <span class="tb-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="tb-title">HENGSCH<b>://</b>TODO — BRUTALIST MOTION <b>v1.0.0</b></span>
      <span class="tb-btns">
        <button class="tb-btn" type="button" data-act="min" aria-label="最小化">–</button>
        <button class="tb-btn" type="button" data-act="max" aria-label="最大化">▢</button>
        <button class="tb-btn" type="button" data-act="close" aria-label="关闭">×</button>
      </span>
    </header>

    <div class="stage">

      <!-- ========== 超大标题 + 完成率水印 ========== -->
      <div class="masthead">
        <div class="watermark" id="watermark" aria-hidden="true">25%</div>
        <div class="mast-kicker">
          <span>HengSch Desktop</span>
          <span class="k-state" id="kickerState">09 OPEN</span>
          <span>2026-10-08</span>
        </div>
        <h1 class="mast-title">TODO <em>/</em> <u>待办</u></h1>
        <div class="mast-meta">
          <span class="chip-stat hot" id="statDone">DONE 03</span>
          <span class="chip-stat" id="statOpen">OPEN 09</span>
          <span class="chip-stat alt" id="statAll">ALL 12</span>
        </div>
      </div>

      <!-- ========== MARQUEE 分组横滚带 ========== -->
      <nav class="marquee" id="marquee" aria-label="分组筛选">
        <div class="marquee-track" id="marqueeTrack"></div>
      </nav>

      <!-- ========== 任务列表 ========== -->
      <ul class="list" id="list" aria-label="任务列表"></ul>

      <!-- ========== 添加按钮 ========== -->
      <button class="fab" id="fab" type="button" aria-haspopup="dialog" aria-label="添加任务">+</button>
    </div>
  </div>
</div>

<!-- ========== 添加浮层 ========== -->
<div class="overlay" id="overlay">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="ovTitle" id="card">
    <h2 id="ovTitle">NEW <span>ENTRY</span></h2>
    <p class="card-sub">添加一条新任务 / INSERT INTO LIST</p>
    <form id="addForm" novalidate>
      <div class="field">
        <label for="fTitle">Task Title — 任务标题</label>
        <input type="text" id="fTitle" name="title" placeholder="例：重构设置页信息架构" autocomplete="off" required>
      </div>
      <div class="field">
        <label id="lblGrp">Group — 分组</label>
        <div class="opts" role="group" aria-labelledby="lblGrp">
          <label class="opt" data-g="work"><input type="radio" name="group" value="work" checked><span>Work 工作</span></label>
          <label class="opt" data-g="life"><input type="radio" name="group" value="life"><span>Life 生活</span></label>
          <label class="opt" data-g="study"><input type="radio" name="group" value="study"><span>Study 学习</span></label>
        </div>
      </div>
      <div class="field">
        <label for="fDue">Due — 截止</label>
        <select id="fDue" name="due">
          <option>今天</option>
          <option>明天</option>
          <option>本周五</option>
          <option>周六</option>
          <option>周日</option>
          <option>下周</option>
        </select>
      </div>
      <div class="card-actions">
        <button class="btn btn-primary" type="submit">Insert ↵</button>
        <button class="btn" type="button" id="btnCancel">Esc 关闭</button>
      </div>
    </form>
  </div>
</div>

<div class="sr-only" role="status" aria-live="polite" id="live"></div>

<script>
(function(){
"use strict";

/* ============================================================
   统一假数据（7 套一致）
   ============================================================ */
var GROUPS = [
  {id:"work",  name:"WORK",  cn:"工作"},
  {id:"life",  name:"LIFE",  cn:"生活"},
  {id:"study", name:"STUDY", cn:"学习"},
  {id:"all",   name:"ALL",   cn:"全部"}
];
var GROUP_CN = {work:"工作", life:"生活", study:"学习"};

var tasks = [
  {id:1,  g:"work",  t:"完成 Q4 产品路线图初稿",        s:"pending",   due:"今天",   pri:true},
  {id:2,  g:"work",  t:"Review PR #42 · 认证模块重构",   s:"pending",   due:"今天"},
  {id:3,  g:"work",  t:"准备周五用户访谈提纲",           s:"pending",   due:"明天"},
  {id:4,  g:"work",  t:"回复设计团队组件库反馈",         s:"pending",   due:"本周五"},
  {id:5,  g:"work",  t:"发布 v1.2.0 release notes",     s:"completed", due:""},
  {id:6,  g:"life",  t:"买牛奶和鸡蛋",                   s:"pending",   due:"今天"},
  {id:7,  g:"life",  t:"预约周六洗牙",                   s:"pending",   due:"周六"},
  {id:8,  g:"life",  t:"每日晚间拉伸 15 分钟（循环 daily）",  s:"pending", due:"今天", rep:"daily"},
  {id:9,  g:"life",  t:"给绿萝浇水",                     s:"completed", due:""},
  {id:10, g:"study", t:"读完《设计中的设计》第 3 章",     s:"pending",   due:"今天"},
  {id:11, g:"study", t:"每周整理学习笔记（循环 weekly）",  s:"pending",   due:"周日", rep:"weekly"},
  {id:12, g:"study", t:"TypeScript 泛型练习",            s:"completed", due:""}
];
var nextId = 13;

var filter = "all";
var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
var clashTimer = 0;

var list        = document.getElementById("list");
var marquee     = document.getElementById("marquee");
var track       = document.getElementById("marqueeTrack");
var overlay     = document.getElementById("overlay");
var card        = document.getElementById("card");
var form        = document.getElementById("addForm");
var fab         = document.getElementById("fab");
var live        = document.getElementById("live");
var btnCancel   = document.getElementById("btnCancel");
var fTitle      = document.getElementById("fTitle");
var lastFocused = null;

/* ---------- 工具 ---------- */
function pad(n){ return (n < 10 ? "0" : "") + n; }
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function say(msg){ live.textContent = msg; }

/* ---------- 标题切 token（字符 stagger 入场） ---------- */
function tokenize(str){
  var out = "", idx = 0;
  var re = /[A-Za-z0-9#./·:]+|\s+|[^\s]/g, m;
  while((m = re.exec(str)) !== null){
    /* 空白输出为裸文本节点（inline-block 内空白会塌陷） */
    if(/^\s+$/.test(m[0])){ out += " "; continue; }
    out += '<span class="tok" style="--i:' + (idx++) + '">' + esc(m[0]) + "</span>";
  }
  return out;
}

/* ============================================================
   MARQUEE：WORK—LIFE—STUDY—ALL 循环
   ============================================================ */
function buildMarquee(){
  var seq = "";
  GROUPS.forEach(function(g){
    seq += '<button class="m-item' + (g.id === filter ? " active" : "") +
           '" type="button" data-f="' + g.id + '" aria-pressed="' +
           (g.id === filter) + '">' + g.name + " " + g.cn + "</button>";
    seq += '<span class="m-sep" aria-hidden="true">—</span>';
  });
  track.innerHTML = '<span class="m-seq">' + seq + "</span>" +
                    '<span class="m-seq" aria-hidden="true">' + seq + "</span>";
  marquee.classList.toggle("pinned", filter !== "all");
  var clone = track.querySelectorAll(".m-seq")[1];
  if(clone){
    var btns = clone.querySelectorAll("button");
    for(var i = 0; i < btns.length; i++){ btns[i].setAttribute("tabindex", "-1"); }
  }
}

track.addEventListener("click", function(e){
  var btn = e.target.closest(".m-item");
  if(!btn) return;
  var f = btn.getAttribute("data-f");
  /* 再点当前非 ALL 分组 = 取消筛选，回到 ALL 并恢复滚动 */
  if(f === filter && f !== "all") f = "all";
  setFilter(f);
});

function setFilter(f){
  if(f === filter) return;
  filter = f;
  buildMarquee();
  render();
  var g = GROUPS.filter(function(x){ return x.id === f; })[0];
  say("已筛选分组：" + (g ? g.cn : f));
}

/* ============================================================
   列表渲染
   ============================================================ */
function visibleTasks(){
  return tasks.filter(function(t){ return filter === "all" || t.g === filter; });
}

function rowHTML(t, i){
  var done = t.s === "completed";
  var sub = '<span class="grp">' + esc(GROUP_CN[t.g]) + " · " + t.g.toUpperCase() + "</span>";
  if(t.pri) sub += '<span class="tag-pri">高优先</span>';
  if(t.rep) sub += '<span class="tag-rep">↻ ' + esc(t.rep) + "</span>";

  return '<li class="row' + (done ? " done" : "") + '" data-id="' + t.id + '" style="--row:' + i + '">' +
    '<button class="check" type="button" role="checkbox" aria-checked="' + done + '" ' +
      'aria-label="' + (done ? "取消完成" : "标记完成") + "：" + esc(t.t) + '">' +
      '<span class="tick" aria-hidden="true"></span>' +
    "</button>" +
    '<span class="idx" aria-hidden="true">' + pad(i + 1) + "</span>" +
    '<span class="t-main">' +
      '<span class="t-title">' + tokenize(t.t) + "</span>" +
      '<span class="t-sub">' + sub + "</span>" +
    "</span>" +
    '<span class="meta">' +
      '<span class="sticker" data-g="' + t.g + '">' + esc(GROUP_CN[t.g]) + "</span>" +
      '<span class="due' + (t.due ? "" : " none") + '">' + esc(t.due || "已完成") + "</span>" +
    "</span>" +
  "</li>";
}

function render(){
  var vis = visibleTasks();
  if(vis.length === 0){
    list.innerHTML = '<li class="empty">Nothing Here<small>该分组暂无任务 · 点击右下 + 添加</small></li>';
  }else{
    list.innerHTML = vis.map(rowHTML).join("");
  }
  updateStats();
}

function updateStats(){
  var done = tasks.filter(function(t){ return t.s === "completed"; }).length;
  var all  = tasks.length;
  var pct  = Math.round(done / all * 100);
  document.getElementById("watermark").textContent = pct + "%";
  document.getElementById("statDone").textContent  = "DONE " + pad(done);
  document.getElementById("statOpen").textContent  = "OPEN " + pad(all - done);
  document.getElementById("statAll").textContent   = "ALL "  + pad(all);
  document.getElementById("kickerState").textContent = pad(all - done) + " OPEN";
}

/* ============================================================
   SIGNATURE MOMENT：勾选完成
   strikethrough 120ms 左→右疾扫 + 行 padding 坍缩 + 整页闪一帧
   ============================================================ */
function toggleDone(id){
  var t = tasks.filter(function(x){ return x.id === id; })[0];
  if(!t) return;
  var wasDone = t.s === "completed";
  t.s = wasDone ? "pending" : "completed";

  var row = list.querySelector('.row[data-id="' + id + '"]');
  if(row){
    var btn = row.querySelector(".check");
    row.classList.toggle("done", !wasDone);
    btn.setAttribute("aria-checked", String(!wasDone));
    btn.setAttribute("aria-label", (!wasDone ? "取消完成" : "标记完成") + "：" + t.t);
    /* 划线疾扫 120ms 与行 padding 坍缩均交给 CSS 类切换驱动 */
  }

  if(!wasDone && !reduceMotion.matches){
    document.body.classList.remove("clash");
    void document.body.offsetWidth;
    document.body.classList.add("clash");
    window.clearTimeout(clashTimer);
    clashTimer = window.setTimeout(function(){
      document.body.classList.remove("clash");
      clashTimer = 0;
    }, 260);
  }else if(wasDone){
    /* 完成被撤销：若撞色闪动尚未结束，立即停止 */
    document.body.classList.remove("clash");
    window.clearTimeout(clashTimer);
    clashTimer = 0;
  }

  updateStats();
  say((wasDone ? "已恢复待办：" : "已完成：") + t.t);
}

list.addEventListener("click", function(e){
  var row = e.target.closest(".row");
  if(!row) return;
  toggleDone(parseInt(row.getAttribute("data-id"), 10));
});

/* ============================================================
   添加浮层
   ============================================================ */
function openOverlay(){
  lastFocused = document.activeElement;
  overlay.classList.add("open");
  window.setTimeout(function(){ fTitle.focus(); }, 60);
}
function closeOverlay(){
  overlay.classList.remove("open");
  if(lastFocused && lastFocused.focus) lastFocused.focus();
}
fab.addEventListener("click", openOverlay);
btnCancel.addEventListener("click", closeOverlay);
overlay.addEventListener("mousedown", function(e){
  if(e.target === overlay) closeOverlay();
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && overlay.classList.contains("open")){
    closeOverlay();
  }
  if(e.key === "Tab" && overlay.classList.contains("open")){
    var f = card.querySelectorAll('button, input, select, [tabindex]:not([tabindex="-1"])');
    if(!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

form.addEventListener("submit", function(e){
  e.preventDefault();
  var title = fTitle.value.trim();
  if(!title){ fTitle.focus(); return; }
  var g = form.querySelector('input[name="group"]:checked').value;
  var due = document.getElementById("fDue").value;
  tasks.unshift({
    id: nextId++, g: g, t: title, s: "pending",
    due: due, pri: false, rep: null
  });
  if(filter !== "all" && filter !== g){ filter = "all"; buildMarquee(); }
  fTitle.value = "";
  closeOverlay();
  render();
  list.scrollTop = 0;
  say("已添加任务：" + title);
});

/* 标题栏按钮（演示态反馈） */
document.querySelector(".tb-btns").addEventListener("click", function(e){
  var b = e.target.closest(".tb-btn");
  if(!b) return;
  var act = b.getAttribute("data-act");
  say({min:"最小化", max:"最大化", close:"关闭"}[act] + "（演示）");
  b.animate(
    [{transform:"translate(0,0)"},{transform:"translate(3px,3px)"},{transform:"translate(0,0)"}],
    {duration:120, easing:"linear"}
  );
});

/* ---------- 启动 ---------- */
buildMarquee();
render();
})();
</script>
</body>
</html>
