<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calm OS · HengSch Todo — UI Redesign Demo 06</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E7E2DA;
  --win:#F7F5F2;
  --surface:#FCFBF9;
  --ink:#2B2926;
  --ink-2:#4A4640;
  --muted:#57524A;
  --line:#E6E0D6;
  --hover:#EFEBE5;
  --sage:#5F8A5B;
  --sage-soft:#E6EEE4;
  --mist:#6E93A8;
  --mist-soft:#E6EEF3;
  --amber:#C98A2E;
  --amber-soft:#F6EBD8;
  --focus-blue:#3F6F8A;
  --card:#FFFEFC;
  --seg:#6B655C;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--page);
  color:var(--ink);
  font-family:"Nunito Sans",system-ui,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.6;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 16px;
  -webkit-font-smoothing:antialiased;
}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ---------- skip link ---------- */
.skip{
  position:absolute;left:50%;top:8px;transform:translate(-50%,-200%);
  background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;
  font-size:13px;font-weight:600;text-decoration:none;z-index:50;
  transition:transform .2s var(--ease);
}
.skip:focus{transform:translate(-50%,0)}

/* ---------- window ---------- */
.window{
  width:800px;height:600px;
  background:var(--win);
  border:1px solid #EAE5DD;
  border-radius:12px;
  box-shadow:0 24px 60px rgba(43,41,38,.14), 0 4px 14px rgba(43,41,38,.07);
  overflow:hidden;
  display:flex;flex-direction:column;
  position:relative;
}
.titlebar{
  height:44px;flex:none;
  display:flex;align-items:center;gap:10px;
  padding:0 8px 0 16px;
  background:linear-gradient(180deg,#FBF9F6 0%, #F4F1EC 100%);
  border-bottom:1px solid var(--line);
  cursor:default;
  user-select:none;
}
.tb-mark{
  width:9px;height:9px;border-radius:50%;
  background:var(--sage);
  box-shadow:0 0 0 3px rgba(95,138,91,.18);
  flex:none;
}
.tb-title{font-size:13px;font-weight:600;letter-spacing:.01em}
.tb-sub{font-size:12px;color:var(--muted);margin-left:2px}
.tb-spacer{flex:1}
.tb-btn{
  width:44px;height:32px;
  display:grid;place-items:center;
  background:transparent;border:0;border-radius:7px;
  color:var(--ink-2);cursor:pointer;
  transition:background .2s var(--ease), color .2s var(--ease);
}
.tb-btn:hover{background:#EAE5DD}
.tb-btn.close:hover{background:#B4544C;color:#fff}
.tb-btn svg{display:block}

/* ---------- header ---------- */
.app-head{
  flex:none;
  padding:16px 24px 12px;
  display:flex;align-items:flex-start;gap:16px;
}
.app-title{font-size:19px;font-weight:600;line-height:1.35;margin:0}
.app-progress{
  margin:4px 0 0;font-size:13.5px;color:var(--ink-2);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.pdot{
  width:8px;height:8px;border-radius:50%;background:var(--sage);flex:none;
}
#progressText{transition:opacity .25s var(--ease)}
#progressText.swap{opacity:.25}
.head-actions{margin-left:auto;display:flex;gap:8px;flex:none}

/* ---------- buttons ---------- */
.btn{
  font:inherit;font-size:13px;font-weight:600;
  min-height:36px;padding:0 14px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;
  border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);
  cursor:pointer;
  transition:background .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease);
}
.btn:hover{background:var(--hover);border-color:#DBD4C8}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-primary:hover{background:#3A3630;border-color:#3A3630}
.btn-green{background:var(--sage);border-color:var(--sage);color:#fff}
.btn-green:hover{background:#547C50;border-color:#547C50}
.btn-lg{min-height:44px;padding:0 22px;font-size:14.5px;border-radius:12px}

/* ---------- focus ring (3px, visible everywhere) ---------- */
a:focus-visible,button:focus-visible,input:focus-visible,
select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--focus-blue);
  outline-offset:2px;
  border-radius:10px;
}
.tb-btn:focus-visible{border-radius:7px}
.seg-btn:focus-visible,.chip-filter:focus-visible{border-radius:999px}
.check:focus-visible{border-radius:50%}
.row:focus-visible{border-radius:12px}

/* ---------- filter chips ---------- */
.filterbar{
  flex:none;
  padding:0 24px 12px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.chip-filter{
  font:inherit;font-size:12.5px;font-weight:600;
  min-height:34px;padding:0 14px;
  display:inline-flex;align-items:center;gap:7px;
  border-radius:999px;
  border:1px solid var(--line);
  background:transparent;color:var(--ink-2);
  cursor:pointer;
  transition:background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease);
}
.chip-filter:hover{background:var(--hover)}
.chip-filter[aria-pressed="true"]{
  background:var(--ink);border-color:var(--ink);color:#fff;
}
.chip-filter .cnt{font-size:11.5px;opacity:.72;font-variant-numeric:tabular-nums}
.chip-filter .sq{font-size:11px;line-height:1}

/* ---------- main split ---------- */
.main{
  flex:1;min-height:0;
  display:grid;grid-template-columns:62% 38%;
  border-top:1px solid var(--line);
}
.timeline-col{
  min-width:0;min-height:0;
  display:flex;flex-direction:column;
  padding:12px 0 0;
  transition:filter .3s var(--ease), opacity .3s var(--ease);
  transform:translateZ(0);
}
.timeline-scroll{
  overflow-y:auto;overflow-x:hidden;
  padding:0 20px 24px;
  scrollbar-width:thin;
  scrollbar-color:#D8D1C5 transparent;
}
.timeline-scroll::-webkit-scrollbar{width:8px}
.timeline-scroll::-webkit-scrollbar-thumb{background:#D8D1C5;border-radius:8px;border:2px solid var(--win)}
.timeline-scroll::-webkit-scrollbar-track{background:transparent}

/* ---------- timeline segments ---------- */
.seg{position:relative;padding-left:26px;padding-top:6px}
.seg::before{
  content:"";position:absolute;left:6px;top:0;bottom:0;
  width:2px;background:var(--line);border-radius:2px;
}
.seg:last-child::before{bottom:18px}
.seg-head{
  display:flex;align-items:baseline;gap:8px;
  font-size:11.5px;font-weight:700;letter-spacing:.14em;
  color:var(--seg);
  padding:8px 0 6px;
  position:relative;
}
.seg-head::before{
  content:"";position:absolute;left:-24px;top:50%;
  width:8px;height:8px;margin-top:-4px;margin-left:3px;
  background:var(--win);border:2px solid #CFC7BA;border-radius:50%;
}
.seg-time{font-weight:500;letter-spacing:.06em;color:#7A746B;font-size:11px}

.row{
  position:relative;
  display:flex;align-items:center;gap:12px;
  min-height:56px;
  padding:6px 8px 6px 6px;
  margin-left:-6px;
  border-radius:12px;
  transition:background .2s var(--ease);
}
.row:hover{background:var(--hover)}
.row + .row{margin-top:2px}
/* node lamp */
.node{
  position:absolute;left:-24px;top:50%;margin-top:-6px;
  width:12px;height:12px;border-radius:50%;
  background:var(--win);
  border:2px solid #C6BFB3;
  transition:background .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease);
}
.row.due .node{border-color:var(--amber);background:var(--amber-soft)}
.row.completed .node{
  border-color:var(--sage);
  background:var(--sage);
  box-shadow:0 0 0 3px rgba(95,138,91,.16), 0 0 10px rgba(95,138,91,.35);
}
@keyframes lampGlow{
  0%{box-shadow:0 0 0 0 rgba(95,138,91,.45), 0 0 0 rgba(95,138,91,0)}
  45%{box-shadow:0 0 0 7px rgba(95,138,91,.28), 0 0 14px rgba(95,138,91,.5)}
  100%{box-shadow:0 0 0 3px rgba(95,138,91,.16), 0 0 10px rgba(95,138,91,.35)}
}
.row.lit .node{animation:lampGlow .7s var(--ease) both}

/* check circle 44px */
.check{
  position:relative;flex:none;
  width:44px;height:44px;
  display:grid;place-items:center;
  background:transparent;border:0;padding:0;
  border-radius:50%;cursor:pointer;
}
.check .ring{
  width:24px;height:24px;border-radius:50%;
  border:2px solid #A79F92;
  background:var(--surface);
  display:grid;place-items:center;
  transition:background .25s var(--ease), border-color .25s var(--ease), transform .25s var(--ease);
}
.check:hover .ring{border-color:var(--sage);transform:scale(1.06)}
.check .tick{opacity:0;transform:scale(.5);transition:opacity .2s var(--ease), transform .25s var(--ease)}
.check .tick svg{display:block}
.row.completed .check .ring,
.row.completed .check .ring.once{
  background:var(--sage);border-color:var(--sage);
}
.row.completed .check .tick{opacity:1;transform:scale(1)}
/* signature: breathing ring */
.breathe{
  position:absolute;left:50%;top:50%;
  width:34px;height:34px;margin:-17px 0 0 -17px;
  border-radius:50%;
  border:3px solid var(--sage);
  opacity:0;pointer-events:none;
}
@keyframes breatheRing{
  0%{transform:scale(1);opacity:.95}
  45%{transform:scale(1.15);opacity:.45}
  100%{transform:scale(1);opacity:0}
}
.check.breathing .breathe{animation:breatheRing .6s var(--ease) both}

.row-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.row-title{
  font-size:14.5px;font-weight:600;color:var(--ink);
  line-height:1.45;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:color .25s var(--ease);
}
.row-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.group-chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:600;letter-spacing:.03em;
  padding:2px 8px;border-radius:999px;
}
.group-chip .sq{font-size:10px;line-height:1}
.g-work{background:#F6E4E2;color:#8C3B35}
.g-life{background:var(--sage-soft);color:#3F6B3C}
.g-study{background:var(--mist-soft);color:#3F6478}
.due-tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;color:var(--muted);font-weight:600;
}
.due-tag svg{display:block;opacity:.85}
.row.completed .due-tag .dotsep,
.row.completed .due-tag .clock{display:none}
.state-tag{
  display:none;align-items:center;gap:4px;
  font-size:11.5px;font-weight:700;
  padding:1px 7px;border-radius:999px;
}
.row.completed .state-tag{
  display:inline-flex;background:var(--sage-soft);color:#37602F;
}
.pri-tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:700;letter-spacing:.02em;
  padding:1px 7px;border-radius:999px;
  background:var(--amber-soft);color:#7C5310;
}
.row.completed .row-title{
  color:#6E675E;font-weight:500;
}
.row.completed .group-chip{opacity:.75}
.expand-more{
  font-size:11.5px;font-weight:600;color:#7A746B;
  margin-left:4px;display:inline-flex;align-items:center;gap:4px;
}
.row:not(:hover):not(:focus-within) .expand-more{opacity:.55}

/* completed fold */
.fold-btn{
  font:inherit;
  width:100%;
  display:flex;align-items:center;gap:10px;
  min-height:48px;padding:8px 10px;
  background:transparent;border:1px dashed #D8D1C5;border-radius:12px;
  color:var(--ink-2);font-size:13px;font-weight:600;
  cursor:pointer;text-align:left;
  transition:background .2s var(--ease), border-color .2s var(--ease);
}
.fold-btn:hover{background:var(--hover);border-color:#C9C1B4}
.fold-btn .chev{margin-left:auto;transition:transform .25s var(--ease);display:grid;place-items:center}
.fold-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fold-btn .fold-count{
  font-size:11.5px;font-weight:700;color:#37602F;
  background:var(--sage-soft);border-radius:999px;padding:1px 8px;
}
.fold-panel[hidden]{display:none}
.fold-panel{padding-top:6px}
.fold-panel .seg{padding-top:0}

/* ---------- empty state ---------- */
.empty{
  display:none;
  flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:6px;
  padding:44px 20px 40px;
}
.empty.show{display:flex}
.illu{position:relative;width:132px;height:92px;margin-bottom:8px}
.illu .pot{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:52px;height:34px;background:#E4DAC9;
  border-radius:6px 6px 16px 16px;
  box-shadow:inset 0 -6px 0 rgba(43,41,38,.05);
}
.illu .pot::before{
  content:"";position:absolute;left:-5px;top:-6px;
  width:62px;height:12px;background:#EDE5D7;border-radius:8px;
}
.illu .leaf{
  position:absolute;left:50%;bottom:40px;
  width:26px;height:44px;background:var(--sage);
  border-radius:60% 5% 60% 5%;
  transform-origin:bottom center;
}
.illu .l1{transform:translateX(-50%) rotate(-26deg);opacity:.85}
.illu .l2{transform:translateX(-24%) rotate(4deg);height:52px;background:#6E9A69}
.illu .l3{transform:translateX(-72%) rotate(-2deg);height:36px;background:#7CA477;opacity:.9}
.illu .cloud{
  position:absolute;top:4px;left:8px;
  width:56px;height:24px;background:#FFFDF8;border-radius:999px;
  box-shadow:0 3px 8px rgba(43,41,38,.06);
}
.illu .cloud::before,.illu .cloud::after{
  content:"";position:absolute;background:#FFFDF8;border-radius:50%;
}
.illu .cloud::before{width:24px;height:24px;left:10px;top:-11px}
.illu .cloud::after{width:17px;height:17px;left:30px;top:-7px}
.illu .cloud.c2{top:14px;left:auto;right:0;width:40px;height:18px;opacity:.8}
.illu .cloud.c2::before{width:17px;height:17px;left:7px;top:-8px}
.illu .cloud.c2::after{width:12px;height:12px;left:21px;top:-5px}
.empty h3{margin:0;font-size:15.5px;font-weight:600;color:var(--ink)}
.empty p{margin:0;font-size:13px;color:var(--muted);max-width:250px}

/* ---------- focus column ---------- */
.focus-col{
  min-width:0;min-height:0;
  border-left:1px solid var(--line);
  background:linear-gradient(180deg,#F3F0EA 0%, #F1EDE7 100%);
  padding:16px;
  overflow-y:auto;
  display:flex;flex-direction:column;gap:12px;
  transition:background .3s var(--ease), box-shadow .3s var(--ease);
}
.focus-card{
  background:var(--card);
  border:1px solid #ECE7DE;
  border-radius:16px;
  padding:18px 16px 16px;
  box-shadow:0 6px 18px rgba(43,41,38,.06);
  transition:box-shadow .3s var(--ease), transform .3s var(--ease), border-color .3s var(--ease);
}
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.16em;
  color:var(--seg);text-transform:uppercase;
  display:flex;align-items:center;gap:8px;
}
.eyebrow .pip{
  width:7px;height:7px;border-radius:50%;background:var(--mist);
  box-shadow:0 0 0 3px rgba(110,147,168,.18);
}
.focus-task{
  margin:10px 0 2px;
  font-size:16px;font-weight:600;line-height:1.5;color:var(--ink);
}
.focus-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.timer{
  font-size:52px;font-weight:600;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
  line-height:1.15;
  margin:14px 0 2px;
  color:var(--ink);
  transition:color .3s var(--ease);
}
.focus-card.running .timer{color:var(--mist)}
.timer-sub{font-size:12px;color:var(--muted);min-height:19px}
.focus-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.focus-actions .btn{flex:1;justify-content:center;min-width:112px;white-space:nowrap;padding:0 14px}
.next-card{
  background:rgba(255,254,252,.72);
  border:1px solid #ECE7DE;
  border-radius:14px;
  padding:14px 14px 8px;
  box-shadow:0 3px 10px rgba(43,41,38,.04);
}
.next-card h4{
  margin:0 0 4px;font-size:11px;font-weight:700;
  letter-spacing:.14em;color:var(--seg);text-transform:uppercase;
}
.next-item{
  display:flex;gap:9px;align-items:flex-start;
  padding:8px 0;font-size:13px;color:var(--ink-2);line-height:1.5;
}
.next-item + .next-item{border-top:1px solid #EFEAE1}
.next-item .dot{
  flex:none;width:8px;height:8px;border-radius:50%;
  margin-top:6px;border:2px solid #C6BFB3;background:transparent;
}
.next-item .due{color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap}
.next-empty{font-size:12.5px;color:var(--muted);padding:6px 0 10px}

/* focus mode */
body.focus-mode .timeline-col{filter:blur(2px);opacity:.5;pointer-events:none}
body.focus-mode .focus-col{
  background:linear-gradient(180deg,#F6F3EE 0%, #F3F0EA 100%);
}
body.focus-mode .focus-card{
  box-shadow:0 18px 40px rgba(43,41,38,.16);
  transform:translateY(-2px);
  border-color:#E4DDD1;
}
.focus-hint{
  font-size:12px;color:var(--muted);text-align:center;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
body:not(.focus-mode) .focus-hint{visibility:hidden}
.focus-hint kbd{
  font:inherit;font-size:11px;font-weight:700;
  background:#EAE5DC;border:1px solid #DCD5C9;border-bottom-width:2px;
  border-radius:5px;padding:0 5px;color:var(--ink-2);
}

/* ---------- add-task popover ---------- */
.scrim{
  position:absolute;inset:0;background:rgba(43,41,38,.14);
  opacity:0;pointer-events:none;transition:opacity .25s var(--ease);
  z-index:20;border-radius:12px;
}
.scrim.open{opacity:1;pointer-events:auto}
.popover{
  position:absolute;top:96px;right:22px;z-index:30;
  width:328px;
  background:var(--surface);
  border:1px solid #E4DED3;
  border-radius:14px;
  box-shadow:0 18px 44px rgba(43,41,38,.18);
  padding:16px;
  opacity:0;transform:translateY(-8px) scale(.98);
  pointer-events:none;
  transition:opacity .22s var(--ease), transform .22s var(--ease);
}
.popover.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.pop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pop-head h3{margin:0;font-size:15px;font-weight:600}
.icon-btn{
  width:36px;height:36px;display:grid;place-items:center;
  background:transparent;border:0;border-radius:9px;color:var(--ink-2);
  cursor:pointer;transition:background .2s var(--ease);
}
.icon-btn:hover{background:var(--hover)}
.field{margin-bottom:12px}
.field label{
  display:block;font-size:12px;font-weight:700;
  letter-spacing:.06em;color:var(--ink-2);margin-bottom:5px;
}
.field input,.field select{
  font:inherit;font-size:14px;color:var(--ink);
  width:100%;min-height:44px;
  padding:0 12px;
  background:#fff;
  border:1px solid #DCD5C9;border-radius:10px;
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.field input::placeholder{color:#8A8378}
.field input:hover,.field select:hover{border-color:#C7BFB2}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pop-actions{display:flex;gap:8px;margin-top:4px}
.pop-actions .btn{flex:1;justify-content:center}
.hint{font-size:11.5px;color:var(--muted);margin:8px 0 0;text-align:center}

/* ---------- toast ---------- */
.toast{
  position:absolute;left:50%;bottom:18px;transform:translate(-50%,14px);
  z-index:40;
  background:var(--ink);color:#FBFAF7;
  font-size:13px;font-weight:600;
  padding:10px 16px;border-radius:999px;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 10px 26px rgba(43,41,38,.24);
  opacity:0;pointer-events:none;
  transition:opacity .25s var(--ease), transform .25s var(--ease);
  max-width:560px;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ok{color:#A8D3A3}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
  .breathe{display:none}
  .check .ring{transition:background .01ms, border-color .01ms}
  body.focus-mode .timeline-col{filter:none;opacity:.6}
  .popover{transform:none}
  .popover.open{transform:none}
}
</style>
</head>
<body>
<a class="skip" href="#timeline">跳到任务时间轴</a>

<div class="window" role="application" aria-label="HengSch Todo 桌面窗口 Calm OS 方案">

  <!-- 标题栏 -->
  <header class="titlebar">
    <span class="tb-mark" aria-hidden="true"></span>
    <span class="tb-title">HengSch Todo</span>
    <span class="tb-sub">Calm OS · 安静的一天</span>
    <span class="tb-spacer"></span>
    <button class="tb-btn" type="button" aria-label="最小化">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true"><path d="M1.5 5.5h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button class="tb-btn" type="button" aria-label="最大化">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true"><rect x="1.7" y="1.7" width="7.6" height="7.6" rx="1.4" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <button class="tb-btn close" type="button" aria-label="关闭">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true"><path d="M2.2 2.2l6.6 6.6M8.8 2.2L2.2 8.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </header>

  <!-- 头部 -->
  <div class="app-head">
    <div>
      <h1 class="app-title">今天</h1>
      <p class="app-progress" id="progressWrap">
        <span class="pdot" aria-hidden="true"></span>
        <span id="progressText">很好，今天已完成 3/8</span>
      </p>
    </div>
    <div class="head-actions">
      <button class="btn btn-primary" id="addBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 1.6v8.8M1.6 6h8.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        添加任务
      </button>
    </div>
  </div>

  <!-- 分组筛选 -->
  <div class="filterbar" role="group" aria-label="按分组筛选任务">
    <button class="chip-filter" type="button" data-filter="all" aria-pressed="true">全部 <span class="cnt">12</span></button>
    <button class="chip-filter" type="button" data-filter="work" aria-pressed="false"><span class="sq" aria-hidden="true">▣</span>工作 <span class="cnt">5</span></button>
    <button class="chip-filter" type="button" data-filter="life" aria-pressed="false"><span class="sq" aria-hidden="true">▣</span>生活 <span class="cnt">4</span></button>
    <button class="chip-filter" type="button" data-filter="study" aria-pressed="false"><span class="sq" aria-hidden="true">▣</span>学习 <span class="cnt">3</span></button>
  </div>

  <!-- 主体 -->
  <main class="main">
    <section class="timeline-col" id="timeline" aria-label="今日时间轴">
      <div class="timeline-scroll" id="timelineScroll">
        <div id="segments"></div>

        <div class="empty" id="emptyState">
          <div class="illu" aria-hidden="true">
            <span class="cloud"></span>
            <span class="cloud c2"></span>
            <span class="leaf l1"></span>
            <span class="leaf l3"></span>
            <span class="leaf l2"></span>
            <span class="pot"></span>
          </div>
          <h3>这里空空的，很清爽</h3>
          <p>换个分组看看，或者添加一件小事，慢慢来就好。</p>
        </div>
      </div>
    </section>

    <aside class="focus-col" aria-label="专注卡片">
      <div class="focus-card" id="focusCard">
        <div class="eyebrow"><span class="pip" aria-hidden="true"></span><span id="eyebrowText">当前专注</span></div>
        <p class="focus-task" id="focusTask">完成 Q4 产品路线图初稿</p>
        <div class="focus-meta" id="focusMeta"></div>
        <div class="timer" id="timer" role="timer" aria-live="off" aria-label="专注倒计时">25:00</div>
        <div class="timer-sub" id="timerSub">一个番茄钟 · 25 分钟</div>
        <div class="focus-actions">
          <button class="btn btn-green btn-lg" id="startBtn" type="button">
            <svg width="12" height="13" viewBox="0 0 12 13" fill="none" aria-hidden="true"><path d="M2.2 1.9v9.2l7.6-4.6-7.6-4.6z" fill="currentColor"/></svg>
            <span id="startBtnText">开始专注</span>
          </button>
          <button class="btn btn-lg" id="switchBtn" type="button">换一个</button>
        </div>
      </div>

      <div class="next-card">
        <h4 id="nextHead">接下来 2 件</h4>
        <div id="nextList"></div>
      </div>

      <p class="focus-hint">已进入专注模式 · 按 <kbd>Esc</kbd> 或「暂停」退出</p>
    </aside>
  </main>

  <!-- 添加任务浮层 -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="popover" id="popover" role="dialog" aria-modal="true" aria-labelledby="popTitle" hidden>
    <div class="pop-head">
      <h3 id="popTitle">添加任务</h3>
      <button class="icon-btn" id="popClose" type="button" aria-label="关闭添加任务">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.4 2.4l7.2 7.2M9.6 2.4L2.4 9.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form id="addForm" novalidate>
      <div class="field">
        <label for="fTitle">要做什么？</label>
        <input id="fTitle" name="title" type="text" placeholder="例如：整理本周灵感便签" autocomplete="off" required maxlength="60">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="fGroup">分组</label>
          <select id="fGroup" name="group">
            <option value="work">▣ 工作</option>
            <option value="life">▣ 生活</option>
            <option value="study">▣ 学习</option>
          </select>
        </div>
        <div class="field">
          <label for="fDue">时间</label>
          <select id="fDue" name="due">
            <option value="today-am">今天 · 上午</option>
            <option value="today-pm" selected>今天 · 下午</option>
            <option value="today-eve">今天 · 晚上</option>
            <option value="next">接下来</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="fPriority">优先级</label>
        <select id="fPriority" name="priority">
          <option value="none">普通</option>
          <option value="high">高优先</option>
        </select>
      </div>
      <div class="pop-actions">
        <button class="btn" type="button" id="popCancel">取消</button>
        <button class="btn btn-primary" type="submit">加入清单</button>
      </div>
      <p class="hint">回车即可加入 · Esc 关闭</p>
    </form>
  </div>

  <!-- 无障碍播报 + 提示 -->
  <div class="sr-only" id="live" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="toast" id="toast" aria-hidden="true"></div>
</div>

<script>
(function(){
  "use strict";

  /* ========== 统一假数据 ========== */
  var GROUPS = {
    work:{name:"工作"},
    life:{name:"生活"},
    study:{name:"学习"}
  };
  var tasks = [
    {id:1,  title:"完成 Q4 产品路线图初稿",          group:"work",  status:"pending",  due:"今天", seg:"today-am", priority:"high"},
    {id:2,  title:"Review PR #42 · 认证模块重构",     group:"work",  status:"pending",  due:"今天", seg:"today-pm"},
    {id:3,  title:"准备周五用户访谈提纲",            group:"work",  status:"pending",  due:"明天", seg:"next"},
    {id:4,  title:"回复设计团队组件库反馈",          group:"work",  status:"pending",  due:"本周五", seg:"next"},
    {id:5,  title:"发布 v1.2.0 release notes",       group:"work",  status:"completed"},
    {id:6,  title:"买牛奶和鸡蛋",                    group:"life",  status:"pending",  due:"今天", seg:"today-pm"},
    {id:7,  title:"预约周六洗牙",                    group:"life",  status:"pending",  due:"周六", seg:"next"},
    {id:8,  title:"每日晚间拉伸 15 分钟（循环 daily）", group:"life", status:"pending", due:"今天", seg:"today-eve", repeat:"daily"},
    {id:9,  title:"给绿萝浇水",                      group:"life",  status:"completed"},
    {id:10, title:"读完《设计中的设计》第 3 章",       group:"study", status:"pending",  due:"今天", seg:"today-eve"},
    {id:11, title:"每周整理学习笔记（循环 weekly）",   group:"study", status:"pending",  due:"周日", seg:"next", repeat:"weekly"},
    {id:12, title:"TypeScript 泛型练习",             group:"study", status:"completed"}
  ];
  var nextId = 13;

  var SEGS = [
    {key:"today-am",  label:"今天 · 上午", time:"09:00 – 12:00"},
    {key:"today-pm",  label:"今天 · 下午", time:"13:00 – 18:00"},
    {key:"today-eve", label:"今天 · 晚上", time:"19:00 – 22:00"},
    {key:"next",      label:"接下来",      time:"明天起"}
  ];

  /* ========== 状态 ========== */
  var filter = "all";
  var focusId = 1;
  var running = false;
  var remaining = 25 * 60;
  var tickHandle = null;
  var foldOpen = false;
  var lastFocused = null;
  var completedIds = tasks.filter(function(t){return t.status === "completed";}).map(function(t){return t.id;});
  var prevProgress = "";

  var $ = function(id){ return document.getElementById(id); };
  var live = $("live"), toast = $("toast");

  function byId(id){
    for (var i = 0; i < tasks.length; i++){ if (tasks[i].id === id) return tasks[i]; }
    return null;
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function visible(t){ return filter === "all" || t.group === filter; }
  function reducedMotion(){
    try{
      return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    }catch(e){ return false; }
  }

  /* ========== 图标 ========== */
  function clockIcon(){
    return '<svg class="clock" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">' +
      '<circle cx="6" cy="6" r="4.6" stroke="currentColor" stroke-width="1.3"/>' +
      '<path d="M6 3.4V6l1.8 1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  var checkIcon = '<svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">' +
    '<path d="M2.6 6.9l2.6 2.6 5.2-5.6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var refreshIcon = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">' +
    '<path d="M10 6a4 4 0 1 1-1.2-2.85" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>' +
    '<path d="M9.7 1.6v2.4H7.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* ========== 渲染：任务行 ========== */
  function taskRowHTML(t){
    var cls = ["row"];
    if (t.status === "completed") cls.push("completed");
    else if (t.due === "今天") cls.push("due");

    var meta = '<span class="group-chip g-' + t.group + '">' +
        '<span class="sq" aria-hidden="true">▣</span>' + GROUPS[t.group].name + '</span>';

    if (t.status === "completed"){
      meta += '<span class="state-tag">' + checkIcon + '已完成</span>';
    } else {
      if (t.repeat){
        meta += '<span class="due-tag">' + refreshIcon + '循环 ' + t.repeat + '</span>';
      }
      if (t.due){
        meta += '<span class="due-tag">' + clockIcon() +
          '<span class="dotsep" aria-hidden="true">·</span>' + esc(t.due) + '</span>';
      }
      if (t.priority === "high"){
        meta += '<span class="pri-tag">高优先</span>';
      }
      meta += '<span class="expand-more">展开详情</span>';
    }

    var stateWord = t.status === "completed" ? "已完成" : "未完成";
    var aria = t.title + "，" + GROUPS[t.group].name + "，" +
      (t.status === "completed" ? "已完成" :
        ((t.due ? t.due + "到期" : "无截止") + "，" + stateWord + "，按下空格切换完成"));

    return '<li class="' + cls.join(" ") + '" data-id="' + t.id + '">' +
      '<span class="node" aria-hidden="true"></span>' +
      '<button class="check" type="button" data-act="toggle" data-id="' + t.id + '" ' +
        'aria-pressed="' + (t.status === "completed") + '" aria-label="' + esc(aria) + '">' +
        '<span class="ring">' + (t.status === "completed" ? checkIcon : '') + '</span>' +
        '<span class="breathe" aria-hidden="true"></span>' +
      '</button>' +
      '<span class="row-body">' +
        '<span class="row-title">' + esc(t.title) + '</span>' +
        '<span class="row-meta">' + meta + '</span>' +
      '</span>' +
    '</li>';
  }

  function listHTML(items, emptyHTML){
    if (!items.length) return emptyHTML || "";
    return '<ul class="seg-list" style="list-style:none;margin:0;padding:0">' +
      items.map(taskRowHTML).join("") + '</ul>';
  }

  /* ========== 渲染：时间轴 ========== */
  function renderTimeline(){
    var box = $("segments");
    var parts = [];
    var anyVisible = false;

    SEGS.forEach(function(s){
      var items = tasks.filter(function(t){
        return t.status === "pending" && t.seg === s.key && visible(t);
      });
      if (!items.length) return;
      anyVisible = true;
      parts.push(
        '<section class="seg" data-seg="' + s.key + '">' +
          '<h2 class="seg-head">' + s.label + '<span class="seg-time">' + s.time + '</span></h2>' +
          listHTML(items) +
        '</section>'
      );
    });

    var doneAll = tasks.filter(function(t){ return t.status === "completed"; });
    var doneVis = doneAll.filter(visible);
    if (doneVis.length){
      anyVisible = true;
      parts.push(
        '<section class="seg" data-seg="done">' +
          '<button class="fold-btn" type="button" id="foldBtn" aria-expanded="' + foldOpen + '" aria-controls="foldPanel">' +
            '<span class="fold-count">' + doneVis.length + '</span>' +
            '<span>已完成 · ' + doneVis.length + '</span>' +
            '<span class="chev" aria-hidden="true">' +
              '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '</span>' +
          '</button>' +
          '<div class="fold-panel" id="foldPanel"' + (foldOpen ? '' : ' hidden') + '>' +
            listHTML(doneVis) +
          '</div>' +
        '</section>'
      );
    }

    box.innerHTML = parts.join("");
    $("emptyState").classList.toggle("show", !anyVisible);
    if (!anyVisible){
      $("emptyState").setAttribute("tabindex", "-1");
    }
    renderFocus();
    renderProgress();
    renderCounts();
  }

  /* ========== 渲染：进度微文案 ========== */
  function progressString(){
    var done = tasks.filter(function(t){ return t.status === "completed"; }).length;
    var leftToday = tasks.filter(function(t){
      return t.status === "pending" && t.due === "今天";
    }).length;
    var total = done + leftToday;
    if (total === 0) return "清单空着，正清爽";
    if (leftToday === 0) return "很好，今天的 " + done + " 件都完成了";
    return "很好，今天已完成 " + done + "/" + total;
  }

  function renderProgress(){
    var el = $("progressText");
    var next = progressString();
    if (next === prevProgress) return;
    prevProgress = next;
    el.classList.add("swap");
    window.setTimeout(function(){
      el.textContent = next;
      el.classList.remove("swap");
    }, 130);
  }

  function renderCounts(){
    var map = {all:0, work:0, life:0, study:0};
    tasks.forEach(function(t){ map.all++; map[t.group]++; });
    var btns = document.querySelectorAll(".chip-filter");
    for (var i = 0; i < btns.length; i++){
      var k = btns[i].getAttribute("data-filter");
      var c = btns[i].querySelector(".cnt");
      if (c) c.textContent = map[k];
    }
  }

  /* ========== 渲染：专注卡片 ========== */
  function focusOrder(){
    var t = byId(focusId);
    if (t && t.status === "pending") return t;
    var first = tasks.filter(function(x){ return x.status === "pending"; })[0];
    if (first) focusId = first.id;
    return first || null;
  }

  function renderFocus(){
    var t = focusOrder();
    var card = $("focusCard");
    if (!t){
      $("focusTask").textContent = "现在没有待办，去泡杯茶吧";
      $("focusMeta").innerHTML = "";
      $("startBtn").disabled = true;
      $("switchBtn").disabled = true;
    } else {
      $("focusTask").textContent = t.title;
      var meta = '<span class="group-chip g-' + t.group + '"><span class="sq" aria-hidden="true">▣</span>' +
        GROUPS[t.group].name + '</span>';
      if (t.due) meta += '<span class="due-tag">' + clockIcon() + '<span class="dotsep" aria-hidden="true">·</span>' + esc(t.due) + '</span>';
      if (t.priority === "high") meta += '<span class="pri-tag">高优先</span>';
      $("focusMeta").innerHTML = meta;
      $("startBtn").disabled = false;
      $("switchBtn").disabled = false;
    }
    card.classList.toggle("running", running);

    var upcoming = tasks.filter(function(x){
      return x.status === "pending" && x.id !== focusId && visible(x);
    });
    var slice = upcoming.slice(0, 2);
    $("nextHead").textContent = slice.length ? "接下来 " + slice.length + " 件" : "接下来暂无";
    if (!slice.length){
      $("nextList").innerHTML = '<p class="next-empty">清单已经走到尽头，慢慢来就好。</p>';
    } else {
      $("nextList").innerHTML = slice.map(function(x){
        return '<div class="next-item"><span class="dot" aria-hidden="true"></span>' +
          '<span style="flex:1;min-width:0">' + esc(x.title) + '</span>' +
          '<span class="due">' + (x.due ? esc(x.due) : "无截止") + '</span></div>';
      }).join("");
    }
  }

  /* ========== Signature：完成切换 ========== */
  function toggleTask(id, fromKeyboard){
    var t = byId(id);
    if (!t) return;

    if (t.status === "pending"){
      t.status = "completed";
      if (completedIds.indexOf(id) === -1) completedIds.push(id);

      var rowEl = document.querySelector('.row[data-id="' + id + '"]');
      var checkEl = rowEl ? rowEl.querySelector(".check") : null;
      var reduce = reducedMotion();

      if (checkEl && !reduce){
        checkEl.classList.add("breathing");
        (function(el){
          window.setTimeout(function(){
            if (el && el.classList) el.classList.remove("breathing");
          }, 640);
        })(checkEl);
      }

      if (rowEl){
        rowEl.classList.add("completed");
        rowEl.classList.remove("due");
        rowEl.classList.add("lit");
        (function(el){
          window.setTimeout(function(){
            if (el && el.classList) el.classList.remove("lit");
          }, 760);
        })(rowEl);
        var btn = rowEl.querySelector(".check");
        if (btn){
          btn.setAttribute("aria-pressed", "true");
          btn.setAttribute("aria-label", t.title + "，" + GROUPS[t.group].name + "，已完成，按下空格恢复为未完成");
        }
        var ring = rowEl.querySelector(".ring");
        if (ring && ring.innerHTML.indexOf("svg") === -1) ring.innerHTML = checkIcon;
        var body = rowEl.querySelector(".row-meta");
        if (body){
          body.innerHTML =
            '<span class="group-chip g-' + t.group + '"><span class="sq" aria-hidden="true">▣</span>' + GROUPS[t.group].name + '</span>' +
            '<span class="state-tag">' + checkIcon + '已完成</span>';
        }
        (function(el){
          window.setTimeout(function(){ if (el && el.parentNode) moveToFold(id); }, reduce ? 60 : 620);
        })(rowEl);
      }

      renderProgress();
      renderFocus();
      renderCounts();
      var msg = "已完成：" + t.title + "，" + progressString().replace("很好，", "");
      announce(msg, true);

    } else {
      t.status = "pending";
      var ix = completedIds.indexOf(id);
      if (ix !== -1) completedIds.splice(ix, 1);
      announce("已恢复为未完成：" + t.title + "，" + progressString().replace("很好，", ""), false);
      renderTimeline();
      renderProgress();
      renderFocus();
    }
  }

  function moveToFold(id){
    var t = byId(id);
    if (!t || t.status !== "completed") return;
    renderTimeline();
  }

  /* ========== 播报 / toast ========== */
  function announce(text, showToast){
    live.textContent = "";
    window.setTimeout(function(){ live.textContent = text; }, 40);
    if (showToast) showToastMsg(text);
  }
  var toastTimer = null;
  function showToastMsg(text){
    toast.innerHTML = '<span class="ok" aria-hidden="true">✓</span><span>' + esc(text) + '</span>';
    toast.classList.add("show");
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function(){ toast.classList.remove("show"); }, 3200);
  }

  /* ========== 筛选 ========== */
  function setFilter(f){
    filter = f;
    var btns = document.querySelectorAll(".chip-filter");
    for (var i = 0; i < btns.length; i++){
      btns[i].setAttribute("aria-pressed", String(btns[i].getAttribute("data-filter") === f));
    }
    renderTimeline();
    var label = f === "all" ? "全部" : GROUPS[f].name;
    var n = tasks.filter(visible).length;
    announce("已筛选：" + label + "，共 " + n + " 件", false);
  }

  /* ========== 专注计时 ========== */
  function fmt(sec){
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function paintTimer(){
    $("timer").textContent = fmt(remaining);
    document.title = (running ? fmt(remaining) + " · " : "") + "Calm OS · HengSch Todo — UI Redesign Demo 06";
  }
  function startFocus(){
    if (running) return;
    var t = focusOrder();
    if (!t) return;
    running = true;
    document.body.classList.add("focus-mode");
    $("eyebrowText").textContent = "专注进行中";
    $("startBtnText").textContent = "暂停";
    $("startBtn").classList.remove("btn-green");
    $("startBtn").classList.add("btn-primary");
    $("timerSub").textContent = "正在专注 · " + t.title;
    $("focusCard").classList.add("running");
    paintTimer();
    tickHandle = window.setInterval(function(){
      remaining--;
      if (remaining <= 0){
        remaining = 0;
        pauseFocus();
        announce("一个番茄钟完成了，休息 5 分钟吧", true);
        $("timerSub").textContent = "一个番茄钟完成 · 休息一下";
        remaining = 25 * 60;
        window.setTimeout(paintTimer, 900);
        return;
      }
      paintTimer();
    }, 1000);
    announce("专注开始：" + t.title + "，倒计时 25 分钟", false);
  }
  function pauseFocus(){
    if (!running) return;
    running = false;
    if (tickHandle){ window.clearInterval(tickHandle); tickHandle = null; }
    document.body.classList.remove("focus-mode");
    $("eyebrowText").textContent = "当前专注";
    $("startBtnText").textContent = "开始专注";
    $("startBtn").classList.add("btn-green");
    $("startBtn").classList.remove("btn-primary");
    $("timerSub").textContent = "已暂停 · 剩余 " + fmt(remaining);
    $("focusCard").classList.remove("running");
    announce("已暂停专注，剩余 " + fmt(remaining), false);
  }

  /* ========== 添加任务浮层 ========== */
  var popGen = 0;
  function openPopover(){
    lastFocused = document.activeElement;
    var gen = ++popGen;
    $("scrim").hidden = false;
    $("popover").hidden = false;
    window.requestAnimationFrame(function(){
      if (gen !== popGen) return;
      $("scrim").classList.add("open");
      $("popover").classList.add("open");
    });
    $("addBtn").setAttribute("aria-expanded", "true");
    window.setTimeout(function(){ if (gen === popGen) $("fTitle").focus(); }, 60);
    document.addEventListener("keydown", trapFocus, true);
  }
  function closePopover(){
    var gen = ++popGen;
    $("scrim").classList.remove("open");
    $("popover").classList.remove("open");
    $("addBtn").setAttribute("aria-expanded", "false");
    document.removeEventListener("keydown", trapFocus, true);
    window.setTimeout(function(){
      if (gen !== popGen) return;
      $("scrim").hidden = true;
      $("popover").hidden = true;
    }, 220);
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }
  function popoverOpen(){ return $("popover").classList.contains("open"); }
  function trapFocus(e){
    if (e.key !== "Tab" || !popoverOpen()) return;
    var nodes = $("popover").querySelectorAll("button, input, select, [tabindex]:not([tabindex='-1'])");
    if (!nodes.length) return;
    var first = nodes[0], last = nodes[nodes.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }

  var SEG_LABEL = {"today-am":"今天 · 上午","today-pm":"今天 · 下午","today-eve":"今天 · 晚上","next":"接下来"};
  function addTask(data){
    var t = {
      id: nextId++,
      title: data.title,
      group: data.group,
      status: "pending",
      seg: data.seg,
      due: data.seg === "next" ? "接下来" : "今天"
    };
    if (data.priority === "high") t.priority = "high";

    var insertAt = tasks.length;
    for (var i = 0; i < tasks.length; i++){
      if (tasks[i].status === "completed"){ insertAt = i; break; }
    }
    tasks.splice(insertAt, 0, t);

    if (filter !== "all" && filter !== t.group) setFilter(t.group);
    else renderTimeline();

    announce("已添加：" + t.title + "，" + SEG_LABEL[t.seg], true);
    window.setTimeout(function(){
      var el = document.querySelector('.row[data-id="' + t.id + '"] .check');
      if (el) el.focus();
    }, 60);
  }

  /* ========== 事件绑定 ========== */
  $("segments").addEventListener("click", function(e){
    var chk = e.target.closest ? e.target.closest(".check") : null;
    if (chk){
      toggleTask(parseInt(chk.getAttribute("data-id"), 10), false);
      return;
    }
    var fold = e.target.closest ? e.target.closest("#foldBtn") : null;
    if (fold){
      foldOpen = !foldOpen;
      renderTimeline();
      var again = $("foldBtn");
      if (again) again.focus();
    }
  });

  $("segments").addEventListener("keydown", function(e){
    if (e.code !== "Space" && e.key !== " ") return;
    var chk = e.target.closest ? e.target.closest(".check") : null;
    if (!chk) return;
    e.preventDefault();
    toggleTask(parseInt(chk.getAttribute("data-id"), 10), true);
  });

  document.querySelector(".filterbar").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest(".chip-filter") : null;
    if (b) setFilter(b.getAttribute("data-filter"));
  });

  $("startBtn").addEventListener("click", function(){
    if (running) pauseFocus(); else startFocus();
  });
  $("switchBtn").addEventListener("click", function(){
    var pend = tasks.filter(function(x){ return x.status === "pending" && x.id !== focusId; });
    if (!pend.length){ announce("没有其它待办了", false); return; }
    var cur = tasks.filter(function(x){ return x.status === "pending"; }).map(function(x){ return x.id; });
    var ix = cur.indexOf(focusId);
    focusId = cur[(ix + 1) % cur.length];
    if (running) pauseFocus();
    remaining = 25 * 60;
    paintTimer();
    renderFocus();
    $("timerSub").textContent = "一个番茄钟 · 25 分钟";
    announce("已切换专注任务：" + byId(focusId).title, false);
  });

  $("addBtn").addEventListener("click", function(){ popoverOpen() ? closePopover() : openPopover(); });
  $("popClose").addEventListener("click", closePopover);
  $("popCancel").addEventListener("click", closePopover);
  $("scrim").addEventListener("click", closePopover);

  $("addForm").addEventListener("submit", function(e){
    e.preventDefault();
    var title = $("fTitle").value.trim();
    if (!title){ $("fTitle").focus(); return; }
    addTask({
      title: title,
      group: $("fGroup").value,
      seg: $("fDue").value,
      priority: $("fPriority").value
    });
    $("fTitle").value = "";
    closePopover();
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){
      if (popoverOpen()){ closePopover(); return; }
      if (running){ pauseFocus(); }
    }
  });

  /* ========== 初始化 ========== */
  renderTimeline();
  paintTimer();
})();
</script>
</body>
</html>
